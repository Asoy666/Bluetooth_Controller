<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyBit Robot - IoT & Vision AI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- TensorFlow.js and Teachable Machine Image Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between hidden md:flex z-10 shadow-sm">
            <div>
                <!-- Brand Header -->
                <div class="p-6 flex items-center space-x-3 border-b border-slate-100">
                    <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                        <i class="fa-solid fa-robot text-lg"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-slate-900">Robotic<span class="text-blue-600">web</span></span>
                </div>

                <!-- Navigation Links -->
                <nav class="p-4 space-y-1.5">
                    <a href="#" onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-white bg-blue-600 shadow-md shadow-blue-500/20 transition-all">
                        <i class="fa-solid fa-chart-pie w-5 text-center"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="#" onclick="switchTab('vision')" id="nav-vision" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all">
                        <i class="fa-solid fa-eye w-5 text-center"></i>
                        <span>Vision AI</span>
                    </a>
                    <a href="#" onclick="switchTab('bt')" id="nav-bt" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all">
                        <i class="fa-solid fa-bluetooth-b w-5 text-center"></i>
                        <span>BT Controller</span>
                    </a>
                    <a href="#" onclick="switchTab('help')" id="nav-help" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all">
                        <i class="fa-solid fa-circle-question w-5 text-center"></i>
                        <span>Help Center</span>
                    </a>
                    <a href="#" onclick="switchTab('settings')" id="nav-settings" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all">
                        <i class="fa-solid fa-gear w-5 text-center"></i>
                        <span>Settings</span>
                    </a>
                </nav>
            </div>

            <!-- Developer Card Widget -->
            <div class="p-4 m-4 bg-slate-900 text-white rounded-2xl shadow-lg relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-blue-500/10 rounded-full blur-xl pointer-events-none"></div>
                <div class="text-xs font-semibold text-blue-400 uppercase tracking-wider mb-1">Developer</div>
                <div class="text-sm font-bold text-slate-100 mb-2">M. Aysar Rizqin</div>
                <div class="space-y-1 text-xs text-slate-300">
                    <div class="flex items-center space-x-2 truncate">
                        <i class="fa-brands fa-github text-slate-300 w-4"></i>
                        <span class="truncate">maysarrizqin</span>
                    </div>
                    <div class="flex items-center space-x-2 truncate">
                        <i class="fa-solid fa-envelope text-blue-400 w-4"></i>
                        <span class="truncate">aysarrizqin@gmail.com</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-slate-50">

            <!-- Top Control Bar -->
            <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-20 shadow-xs">
                
                <!-- Status Indicators (BT & FB) -->
                <div class="flex items-center space-x-3">
                    <div id="bt-status-badge" class="px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200 text-xs font-semibold text-slate-500 flex items-center space-x-2 transition-all">
                        <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                        <span>BT: OFFLINE</span>
                    </div>
                    <div id="fb-status-badge" class="px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200 text-xs font-semibold text-slate-500 flex items-center space-x-2 transition-all">
                        <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                        <span>FB: OFFLINE</span>
                    </div>
                </div>

                <!-- Connect Micro:bit Action Only -->
                <div class="flex items-center space-x-3 flex-wrap">
                    <button onclick="connectMicrobit()" id="microbit-connect-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-md shadow-blue-500/20 transition-all flex items-center space-x-2 cursor-pointer">
                        <i class="fa-brands fa-bluetooth"></i>
                        <span>MICRO:BIT</span>
                    </button>
                </div>
            </header>

            <div id="main-content-area" class="p-6 flex-1 flex flex-col max-w-7xl w-full mx-auto">
                <!-- Content injected dynamically via switchTab() -->
            </div>
        </main>
    </div>

    <!-- Modal Custom Mapping BT Controller -->
    <div id="mapping-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5 animate-in fade-in zoom-in duration-200">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="text-base font-bold text-slate-900 flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-blue-600"></i>
                    <span>Pengaturan Mapping Perintah BT</span>
                </h3>
                <button onclick="toggleMappingModal(false)" class="text-slate-400 hover:text-slate-600 text-sm font-bold px-2 py-1">✕</button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">UP (Maju)</label>
                    <input type="text" id="map-up" value="up" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">DOWN (Mundur)</label>
                    <input type="text" id="map-down" value="down" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">LEFT (Kiri)</label>
                    <input type="text" id="map-left" value="left" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">RIGHT (Kanan)</label>
                    <input type="text" id="map-right" value="right" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">STOP (Lepas Semua Tombol)</label>
                    <input type="text" id="map-stop" value="stop" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">OPEN (Buka Gripper)</label>
                    <input type="text" id="map-open" value="open" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">CLOSE (Tutup Gripper)</label>
                    <input type="text" id="map-close" value="close" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                </div>
            </div>

            <div class="pt-2">
                <button onclick="saveMappingConfig()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-3 rounded-xl shadow-md shadow-blue-500/20 transition cursor-pointer">
                    SIMPAN MAPPING
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Message Modal / Box -->
    <div id="notification-modal" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-3">
        <i id="notif-icon" class="fa-solid fa-circle-info text-blue-400"></i>
        <span id="notif-text" class="text-sm font-medium">Notification message</span>
    </div>

    <script>
        // State variables
        let isCameraActive = false;
        let isBluetoothConnected = false;
        let isFirebaseSynced = false;
        let videoStream = null;
        let currentTab = 'dashboard';

        // Teachable Machine Variables
        let tmModel = null;
        let maxPredictions = 0;
        let isModelLoading = false;
        let currentLabels = ['stop', 'up', 'down', 'left', 'right', 'open', 'close'];

        // Custom BT Command Mapping State
        let btMapping = {
            UP: 'up',
            DOWN: 'down',
            LEFT: 'left',
            RIGHT: 'right',
            STOP: 'stop',
            OPEN: 'open',
            CLOSE: 'close'
        };

        // Active key hold tracking to prevent duplicate spamming
        let activeKeyCommand = null;

        // Bluetooth (Nordic UART service used by micro:bit)
        const UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_RX_CHAR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // web -> micro:bit (write)
        const UART_TX_CHAR = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // micro:bit -> web (notify)
        let bleDevice = null;
        let bleRx = null;
        let bleTx = null;
        let isSimulated = false;
        let writeQueue = Promise.resolve();
        let showAllDevices = false;
        let isConnecting = false;

        // Vision auto-send + settings state
        let autoSendEnabled = true;
        let confidenceThreshold = 85;
        let lastVisionLabel = null;
        let lastVisionSent = 0;
        let heldControl = null;
        let lastSliderSent = {};

        // Templates for each tab
        const tabTemplates = {
            dashboard: `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                            <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-microchip"></i></div>
                            <div>
                                <div class="text-xs font-medium text-slate-500">Micro:bit Status</div>
                                <div id="dash-bt-label" class="text-lg font-bold text-slate-800">Disconnected</div>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                            <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-database"></i></div>
                            <div>
                                <div class="text-xs font-medium text-slate-500">Firebase DB</div>
                                <div id="dash-fb-label" class="text-lg font-bold text-slate-800">Offline</div>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                            <div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-eye"></i></div>
                            <div>
                                <div class="text-xs font-medium text-slate-500">AI Model Status</div>
                                <div id="dash-ai-label" class="text-lg font-bold text-slate-800">Ready</div>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                            <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-signal"></i></div>
                            <div>
                                <div class="text-xs font-medium text-slate-500">Packet Rate</div>
                                <div class="text-lg font-bold text-slate-800">12 msg/s</div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                            <h3 class="text-base font-bold text-slate-800 mb-4">Real-time Telemetry Monitor</h3>
                            <div class="h-64 bg-slate-50 rounded-xl border border-dashed border-slate-200 flex flex-col items-center justify-center text-slate-400 p-6 text-center">
                                <i class="fa-solid fa-chart-line text-4xl mb-2 text-blue-500 animate-pulse"></i>
                                <p class="text-sm font-semibold text-slate-700">Live sensor stream graph active</p>
                                <p class="text-xs text-slate-500 mt-1">Listening to micro:bit sensor input & Teachable Machine inference events.</p>
                            </div>
                        </div>
                        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
                            <h3 class="text-base font-bold text-slate-800">Quick Actions</h3>
                            <button onclick="connectMicrobit()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition shadow-sm">Connect Micro:bit</button>
                            <button onclick="switchTab('vision')" class="w-full py-3 bg-purple-50 hover:bg-purple-100 text-purple-700 font-semibold rounded-xl text-sm transition">Open Vision AI Panel</button>
                            <button onclick="switchTab('bt')" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold rounded-xl text-sm transition">Open BT Controller</button>
                        </div>
                    </div>
                </div>
            `,
            vision: `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-5">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Link Model Teachable Machine</label>
                                <div class="flex space-x-2">
                                    <input type="text" id="model-url" value="" placeholder="e.g. https://teachablemachine.withgoogle.com/models/xxxxxx/" class="flex-1 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                                    <button onclick="loadTeachableMachineModel()" id="load-model-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-5 py-3 rounded-xl shadow transition flex items-center space-x-2 cursor-pointer">
                                        <i class="fa-solid fa-cloud-arrow-down"></i>
                                        <span>LOAD MODEL</span>
                                    </button>
                                </div>
                                <p class="text-[11px] text-slate-400 mt-1.5">Masukkan URL Teachable Machine (mengandung model.json atau folder share publik)</p>
                            </div>

                            <div class="flex flex-wrap items-center justify-between gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <div>
                                    <div class="text-sm font-bold text-slate-800 flex items-center space-x-2">
                                        <span>IoT Auto-Send Mode</span>
                                        <span class="bg-blue-100 text-blue-700 text-[10px] font-semibold px-2 py-0.5 rounded">Active</span>
                                    </div>
                                    <div class="text-xs text-slate-500 mt-0.5">Otomatis kirim hasil deteksi (Key: "vision") ke Micro:bit jika confidence > 85%</div>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" id="auto-send-toggle" checked class="sr-only peer" onchange="toggleAutoSend()">
                                    <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-500"></div>
                                </label>
                            </div>

                            <button onclick="toggleCameraState()" id="camera-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm py-3 px-4 rounded-xl shadow-md shadow-emerald-500/20 transition-all flex items-center justify-center space-x-2 cursor-pointer">
                                <i class="fa-solid fa-video text-xs"></i>
                                <span id="camera-btn-text">START CAMERA</span>
                            </button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-col justify-center items-center relative overflow-hidden aspect-video bg-slate-900">
                                <video id="webcam-video" autoplay playsinline muted class="w-full h-full object-cover rounded-xl transform -scale-x-100"></video>
                                <canvas id="canvas-preview" class="hidden"></canvas>
                                <div id="camera-overlay" class="absolute inset-0 bg-slate-900/80 flex flex-col items-center justify-center text-white">
                                    <i class="fa-solid fa-video-slash text-3xl mb-2 text-red-400"></i>
                                    <span class="text-xs font-medium">Camera Offline / Stopped</span>
                                </div>
                            </div>

                            <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                                <div class="text-sm font-bold text-slate-800 mb-3 flex items-center justify-between">
                                    <span>Hasil Prediksi:</span>
                                    <span class="text-xs font-normal text-slate-400" id="ai-status-label">Default Fallback Model</span>
                                </div>
                                <div id="prediction-bars-container" class="space-y-3.5 flex-1 flex flex-col justify-center">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-1 space-y-4">
                        <div class="flex items-center justify-between">
                            <h2 class="text-base font-bold text-slate-900">System Activity</h2>
                            <button onclick="clearLogs()" class="text-xs text-slate-400 hover:text-slate-600 transition">Clear</button>
                        </div>
                        <div id="activity-log-container" class="space-y-3">
                            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex items-start space-x-3.5">
                                <div class="w-8 h-8 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center flex-shrink-0 mt-0.5"><i class="fa-solid fa-eye text-sm"></i></div>
                                <div class="flex-1 min-w-0">
                                    <div class="text-sm font-bold text-slate-800">Vision AI Initialized</div>
                                    <div class="text-xs text-slate-500 mt-0.5 truncate">Ready to load Teachable Machine URL.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            bt: `
                <div class="space-y-6">
                    <div class="bg-white rounded-3xl p-8 shadow-sm text-slate-800 relative overflow-hidden min-h-[520px] flex flex-col justify-between border border-slate-200">
                        <div class="flex flex-wrap items-center justify-between gap-4 z-10">
                            <div>
                                <h2 class="text-2xl font-extrabold tracking-tight text-slate-900">Bluetooth Micro:bit Controller</h2>
                                <p class="text-xs text-slate-500 mt-1">Gunakan tombol arah (tahan tombol Panah pada keyboard), tombol O/C untuk Open/Close, atau klik tombol di layar.</p>
                            </div>
                            <div class="flex items-center space-x-3">
                                <button onclick="toggleMappingModal(true)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs px-4 py-2 rounded-xl shadow-xs border border-slate-200 transition flex items-center space-x-2 cursor-pointer">
                                    <i class="fa-solid fa-sliders text-blue-600"></i>
                                    <span>Mapping Perintah</span>
                                </button>
                                <span id="bt-panel-status" class="bg-slate-100 backdrop-blur-md px-4 py-1.5 rounded-full text-xs font-semibold border border-slate-200 text-slate-600">Micro:bit Disconnected</span>
                                <button onclick="connectMicrobit()" id="bt-panel-connect-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-4 py-2 rounded-xl shadow transition">Connect</button>
                                <button onclick="startDemoMode()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs px-3 py-2 rounded-xl border border-slate-200 transition" title="Tanpa perangkat, hanya untuk uji tampilan">Demo</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center my-8 z-10">
                            <div class="flex flex-col items-center justify-center relative py-6">
                                <div class="relative w-80 h-72 flex items-center justify-center">
                                    
                                    <button id="btn-up" style="touch-action:none" onpointerdown="pressControl('UP')" onpointerup="releaseControl('UP')" onpointerleave="releaseControl('UP')" onpointercancel="releaseControl('UP')" class="absolute top-0 left-1/2 -translate-x-1/2 w-16 h-16 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 rounded-2xl flex items-center justify-center text-slate-700 text-2xl shadow-sm transition border border-slate-200 cursor-pointer">

                else if (e.key === 'o' || e.key === 'O') { direction = 'OPEN'; btnId = 'btn-open'; }
                else if (e.key === 'c' || e.key === 'C') { direction = 'CLOSE'; btnId = 'btn-close'; }

                if (direction) {
                    if (activeKeyCommand !== direction) {
                        activeKeyCommand = direction;
                        sendControllerCmd(direction);
                        setButtonActiveState(btnId, true);

                }
            });

            // Keyup Listener
            window.addEventListener('keyup', function(e) {
                if (currentTab !== 'bt') return;

                let direction = null;
                let btnId = null;

                if (e.key === 'ArrowUp') { direction = 'UP'; btnId = 'btn-up'; }
                else if (e.key === 'ArrowDown') { direction = 'DOWN'; btnId = 'btn-down'; }

        async function loadTeachableMachineModel() {
            const urlInput = document.getElementById('model-url');

                return;
            }

            let rawUrl = urlInput.value.trim();
            if (!rawUrl.endsWith('/')) {

            const modelURL = rawUrl + 'model.json';
            const metadataURL = rawUrl + 'metadata.json';

            const btn = document.getElementById('load-model-btn');
            if(btn) {
                btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>LOADING...</span>`;
                btn.disabled = true;

            showNotification('Mengunduh model Teachable Machine...', 'info');
            addLog('Model Loading', `Menghubungkan ke ${rawUrl}`, 'blue');

            try {

                showNotification(`Model berhasil dimuat! (${maxPredictions} kelas ditemukan)`, 'success');

                    btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-down"></i><span>LOAD MODEL</span>`;

        }

        async function loopPrediction() {
            if (currentTab === 'vision' && isCameraActive) {
                const videoElement = document.getElementById('webcam-video');
                if (tmModel && videoElement && videoElement.readyState === 4) {
                    try {
                        const predictions = await tmModel.predict(videoElement);
                        let topPrediction = predictions[0];
                        
                        predictions.forEach(p => {
                            if (p.probability > topPrediction.probability) {
                                topPrediction = p;
                            }
                            const scorePct = Math.round(p.probability * 100);
                            const sEl = document.getElementById(`score-${p.className}`);
                            const bEl = document.getElementById(`bar-${p.className}`);
                            if(sEl) sEl.innerText = scorePct + '%';
                            if(bEl) bEl.style.width = scorePct + '%';
                        });

                        handleVisionAutoSend(topPrediction);

                        const statusLbl = document.getElementById('ai-status-label');
                        if(statusLbl) {
                            statusLbl.innerText = `Active: ${topPrediction.className} (${Math.round(topPrediction.probability * 100)}%)`;
                        }
                    } catch (e) {}
                } else if (!tmModel && isCameraActive) {
                    simulateFallbackInference();
                }
            }
            window.requestAnimationFrame(loopPrediction);
        }

        function simulateFallbackInference() {
            const directions = currentLabels;
            const chosen = directions[Math.floor(Math.random() * directions.length)];
            
            let scores = {};
            let highKey = chosen;
            let highVal = Math.floor(Math.random() * 20) + 80;
            scores[highKey] = highVal;
            
            let remainder = 100 - highVal;
            const others = directions.filter(d => d !== highKey);
            others.forEach((d, idx) => {
                if (idx === others.length - 1) {
                    scores[d] = remainder;
                } else {
                    let part = Math.floor(Math.random() * remainder);
                    scores[d] = part;
                    remainder -= part;
                }
            });

            directions.forEach(d => {
                const sEl = document.getElementById(`score-${d}`);
                const bEl = document.getElementById(`bar-${d}`);
                if(sEl) sEl.innerText = (scores[d] || 0) + '%';
                if(bEl) bEl.style.width = (scores[d] || 0) + '%';
            });

            const statusLbl = document.getElementById('ai-status-label');
            if(statusLbl && !tmModel) statusLbl.innerText = `Simulated: ${highKey} (${highVal}%)`;
        }

        function describeBleError(err) {
            const name = err && err.name ? err.name : 'Error';
            const msg = (err && err.message) ? err.message : String(err);
            if (name === 'NotFoundError' && /cancel/i.test(msg)) {
                return 'Pemilihan perangkat dibatalkan.';
            }
            if (name === 'NotFoundError' && /service/i.test(msg)) {
                return 'Micro:bit terhubung tetapi tidak punya Bluetooth UART Service. Pastikan program MakeCode berisi blok "bluetooth start UART service" (lihat Help Center).';
            }
            if (name === 'NotFoundError') {
                return 'Tidak ada Micro:bit yang ditemukan. Nyalakan Tiny:bit, pastikan program Bluetooth sedang berjalan, dan tidak sedang terhubung ke aplikasi/HP lain. Jika perlu, aktifkan "Tampilkan semua perangkat" di Settings.';
            }
            if (name === 'SecurityError') {
                return 'Akses Bluetooth diblokir. Buka halaman lewat HTTPS atau file lokal di Chrome/Edge (bukan di dalam iframe/preview).';
            }
            if (name === 'NetworkError') {
                return 'Gagal tersambung (GATT). Di MakeCode aktifkan Project Settings > "No Pairing Required: Yes", hapus pairing lama "BBC micro:bit" di pengaturan Bluetooth perangkat, lalu restart Micro:bit.';
            }
            return name + ': ' + msg;
        }

        function resetBleState() {
            bleRx = null;
            bleTx = null;
            isBluetoothConnected = false;
            isSimulated = false;
            lastVisionLabel = null;
            updateBluetoothUI(false);
        }

        function onBleDisconnected() {
            if (!isBluetoothConnected) return;
            resetBleState();
            addLog('Bluetooth Disconnected', 'Koneksi ke Micro:bit terputus.', 'slate');
            showNotification('Koneksi Micro:bit terputus.', 'warning');
        }

        function onBleData(event) {
            const text = new TextDecoder().decode(event.target.value).trim();
            if (text) addLog('Micro:bit', 'Pesan masuk: ' + text, 'emerald');
        }

        async function connectWithRetry(device, attempts = 3) {
            let lastErr;
            for (let i = 0; i < attempts; i++) {
                try {
                    return await device.gatt.connect();
                } catch (e) {
                    lastErr = e;
                    await new Promise(r => setTimeout(r, 600));
                }
            }
            throw lastErr;
        }

        async function connectMicrobit() {
            if (isConnecting) return;

            // Toggle: disconnect if already connected
            if (isBluetoothConnected) {
                if (heldControl) { heldControl = null; }
                if (isSimulated) {
                    resetBleState();
                } else {
                    try { await sendToMicrobit(btMapping.STOP, true); } catch (e) {}
                    const dev = bleDevice;
                    resetBleState();
                    if (dev && dev.gatt && dev.gatt.connected) dev.gatt.disconnect();
                }
                addLog('Bluetooth Disconnected', 'Koneksi perangkat diputus.', 'slate');
                showNotification('Micro:bit diputus.', 'info');
                return;
            }

            if (!navigator.bluetooth) {
                addLog('Bluetooth Error', 'Browser tidak mendukung Web Bluetooth.', 'slate');
                showNotification('Browser ini tidak mendukung Web Bluetooth. Gunakan Chrome atau Edge (bukan Safari/Firefox/iPhone).', 'warning');
                return;
            }

            isConnecting = true;
            try {
                showNotification('Memindai perangkat Micro:bit...', 'info');
                const options = showAllDevices
                    ? { acceptAllDevices: true, optionalServices: [UART_SERVICE] }
                    : { filters: [{ namePrefix: 'BBC micro:bit' }, { namePrefix: 'micro:bit' }], optionalServices: [UART_SERVICE] };

                bleDevice = await navigator.bluetooth.requestDevice(options);
                bleDevice.addEventListener('gattserverdisconnected', onBleDisconnected);

                showNotification('Menghubungkan ke ' + (bleDevice.name || 'Micro:bit') + '...', 'info');
                const server = await connectWithRetry(bleDevice);
                const service = await server.getPrimaryService(UART_SERVICE);
                bleRx = await service.getCharacteristic(UART_RX_CHAR);
                try {
                    bleTx = await service.getCharacteristic(UART_TX_CHAR);
                    await bleTx.startNotifications();
                    bleTx.addEventListener('characteristicvaluechanged', onBleData);
                } catch (e) {
                    console.warn('Notifikasi UART tidak aktif (opsional):', e);
                }

                isBluetoothConnected = true;
                isSimulated = false;
                updateBluetoothUI(true, false);
                addLog('Bluetooth Connected', 'Terhubung ke ' + (bleDevice.name || 'Micro:bit'), 'emerald');
                showNotification('Berhasil terhubung ke Micro:bit via Bluetooth!', 'success');
            } catch (error) {
                console.error('Bluetooth connection failed:', error);
                if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
                resetBleState();
                const reason = describeBleError(error);
                addLog('Bluetooth Error', reason, 'slate');
                showNotification(reason, 'warning');
            } finally {
                isConnecting = false;
            }
        }

        function startDemoMode() {
            if (isBluetoothConnected) return;
            isBluetoothConnected = true;
            isSimulated = true;
            updateBluetoothUI(true, true);
            addLog('Demo Mode', 'Mode simulasi aktif. Tidak ada data yang dikirim ke robot.', 'emerald');
            showNotification('Mode demo aktif (tanpa perangkat).', 'info');
        }

        function updateBluetoothUI(connected, simulated = false) {
            const btBadge = document.getElementById('bt-status-badge');
            const btBtn = document.getElementById('microbit-connect-btn');
            const btBtnLabel = btBtn ? btBtn.querySelector('span') : null;
            const panelBtn = document.getElementById('bt-panel-connect-btn');
            const dashLabel = document.getElementById('dash-bt-label');
            const btPanelLabel = document.getElementById('bt-panel-status');

            if (connected) {
                btBadge.className = "px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200 text-xs font-semibold text-emerald-700 flex items-center space-x-2 transition-all";
                btBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span>BT: ${simulated ? 'DEMO' : 'CONNECTED'}</span>`;
                if(btBtn) {
                    btBtn.className = "bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-md shadow-emerald-500/20 transition-all flex items-center space-x-2 cursor-pointer";
                }
                if(btBtnLabel) btBtnLabel.innerText = "DISCONNECT";
                if(panelBtn) panelBtn.innerText = "Disconnect";
                if(dashLabel) dashLabel.innerText = simulated ? "Demo" : "Connected";
                if(btPanelLabel) btPanelLabel.innerText = simulated ? "Demo Mode" : "Micro:bit Connected";
            } else {
                btBadge.className = "px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200 text-xs font-semibold text-slate-500 flex items-center space-x-2 transition-all";
                btBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-400"></span><span>BT: OFFLINE</span>`;
                if(btBtn) {
                    btBtn.className = "bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-md shadow-blue-500/20 transition-all flex items-center space-x-2 cursor-pointer";
                }
                if(btBtnLabel) btBtnLabel.innerText = "MICRO:BIT";
                if(panelBtn) panelBtn.innerText = "Connect";
                if(dashLabel) dashLabel.innerText = "Disconnected";
                if(btPanelLabel) btPanelLabel.innerText = "Micro:bit Disconnected";
            }
        }

        // Send one text line (terminated with \n) to the micro:bit UART, chunked to 20 bytes.
        function sendToMicrobit(text, silent = false) {
            if (!isBluetoothConnected) {
                if (!silent) showNotification('Belum terhubung ke Micro:bit. Klik tombol MICRO:BIT dulu.', 'warning');
                return Promise.resolve(false);
            }
            if (isSimulated) return Promise.resolve(true);

            const data = new TextEncoder().encode(text + '\n');
            writeQueue = writeQueue.then(async () => {
                for (let i = 0; i < data.length; i += 20) {
                    await bleRx.writeValue(data.slice(i, i + 20));
                }
                return true;
            }).catch(err => {
                console.error('Gagal mengirim data:', err);
                addLog('Send Error', 'Gagal mengirim: ' + (err.message || err), 'slate');
                return false;
            });
            return writeQueue;
        }

        async function sendControllerCmd(direction) {
            const cmdText = btMapping[direction] || direction.toLowerCase();
            const ok = await sendToMicrobit(cmdText);
            if (ok) {
                addLog('BT Command', `Direction: ${direction} -> Payload: ${cmdText}${isSimulated ? ' (demo)' : ''}`, 'blue');
            }
        }

        // Hold-to-move buttons: pressing sends the command, releasing sends STOP
        function pressControl(direction) {
            if (direction !== 'STOP') heldControl = direction;
            sendControllerCmd(direction);
        }

        function releaseControl(direction) {
            if (heldControl !== direction) return;
            heldControl = null;
            sendControllerCmd('STOP');
        }

        function updateSlider(sliderNum, val) {
            const valEl = document.getElementById(`slider${sliderNum}-val`);
            if(valEl) valEl.innerText = val;

            const now = Date.now();
            if (now - (lastSliderSent[sliderNum] || 0) < 120) return;
            lastSliderSent[sliderNum] = now;
            sendToMicrobit(`slider${sliderNum}:${val}`, true);
        }

        function sendUartCommand() {
            const input = document.getElementById('uart-input');
            const val = input ? input.value.trim() : '';
            if(!val) {
                showNotification('Masukkan perintah UART terlebih dahulu', 'warning');
                return;
            }
            sendToMicrobit(val).then(ok => {
                if (ok) addLog('UART Sent', `Command: ${val}`, 'blue');
            });
        }

        function toggleAutoSend() {
            const tgl = document.getElementById('auto-send-toggle');
            autoSendEnabled = tgl ? tgl.checked : true;
            lastVisionLabel = null;
            showNotification(`IoT Auto-Send ${autoSendEnabled ? 'diaktifkan' : 'dimatikan'}`, 'info');
        }

        // Send the top prediction to the robot when confident and when it changes
        function handleVisionAutoSend(top) {
            if (!autoSendEnabled || !isBluetoothConnected) return;
            if (top.probability * 100 < confidenceThreshold) return;
            const label = String(top.className).trim().toUpperCase();
            if (!Object.prototype.hasOwnProperty.call(btMapping, label)) return;
            if (label === lastVisionLabel) return;
            const now = Date.now();
            if (now - lastVisionSent < 300) return;
            lastVisionLabel = label;
            lastVisionSent = now;
            sendControllerCmd(label);
        }

        function saveSettings() {
            const th = document.getElementById('setting-threshold');
            const v = th ? parseInt(th.value, 10) : NaN;
            if (!isNaN(v) && v >= 1 && v <= 100) confidenceThreshold = v;
            const sa = document.getElementById('setting-show-all');
            if (sa) showAllDevices = sa.checked;
            showNotification('Pengaturan berhasil disimpan!', 'success');
        }

        function addLog(title, desc, type = 'purple') {
            const container = document.getElementById('activity-log-container');
            if(!container) return;

            const icons = {
                'purple': '<i class="fa-solid fa-eye text-sm"></i>',
                'emerald': '<i class="fa-solid fa-circle-check text-sm"></i>',
                'slate': '<i class="fa-solid fa-video-slash text-sm"></i>',
                'blue': '<i class="fa-solid fa-bolt text-sm"></i>'
            };
            const bgColors = {
                'purple': 'bg-purple-50 text-purple-600',
                'emerald': 'bg-emerald-50 text-emerald-600',
                'slate': 'bg-slate-100 text-slate-500',
                'blue': 'bg-blue-50 text-blue-600'
            };

            const logItem = document.createElement('div');
            logItem.className = "bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex items-start space-x-3.5 transition-all hover:shadow-md";
            logItem.innerHTML = `
                <div class="w-8 h-8 rounded-xl ${bgColors[type]} flex items-center justify-center flex-shrink-0 mt-0.5">
                    ${icons[type]}
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-sm font-bold text-slate-800">${title}</div>
                    <div class="text-xs text-slate-500 mt-0.5 truncate">${desc}</div>
                </div>
            `;
            container.prepend(logItem);

            if (container.children.length > 10) {
                container.removeChild(container.lastChild);
            }
        }

        function clearLogs() {
            const container = document.getElementById('activity-log-container');
            if(container) container.innerHTML = '';
            showNotification('Log aktivitas dibersihkan', 'info');
        }

        function showNotification(message, type = 'info') {
            const modal = document.getElementById('notification-modal');
            const text = document.getElementById('notif-text');
            const icon = document.getElementById('notif-icon');
            if(!modal) return;

            text.innerText = message;
            if (type === 'success') {
                icon.className = "fa-solid fa-circle-check text-emerald-400";
            } else if (type === 'warning') {
                icon.className = "fa-solid fa-triangle-exclamation text-amber-400";
            } else {
                icon.className = "fa-solid fa-circle-info text-blue-400";
            }

            modal.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
