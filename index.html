<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

background-image:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.16),transparent 60%),radial-gradient(800px 500px at -5% 10%,rgba(34,211,238,.10),transparent 60%);background-attachment:fixed}
:focus-visible{outline:2px solid rgba(34,211,238,.7);outline-offset:2px}
.glass{border-radius:1rem;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);box-shadow:0 10px 30px rgba(0,0,0,.3);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:border-color .2s}

.btn:disabled{opacity:.4;cursor:not-allowed}.btn:active:not(:disabled){transform:scale(.97)}

.btn-g{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);color:#e2e8f0}.btn-g:hover:not(:disabled){background:rgba(255,255,255,.1)}

input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:1.25rem;width:1.25rem;border-radius:9999px;border:2px solid #22d3ee;background:#060914;box-shadow:0 0 12px rgba(34,211,238,.6)}

<script>
(()=>{
const {useState,useRef,useEffect,useCallback,useMemo,createContext,useContext}=React;
const h=React.createElement;

/* ---------- icons (Lucide paths) ---------- */
const P={

 x:'M18 6 6 18|M6 6l12 12',
 bot:'M12 8V4H8|M4 12h16v8H4z|M2 14h2|M20 14h2|M15 13v2|M9 13v2',
 act:'M22 12h-4l-3 9L9 3l-3 9H2',
 cpu:'M6 6h12v12H6z|M9 2v2|M15 2v2|M9 20v2|M15 20v2|M2 9h2|M2 15h2|M20 9h2|M20 15h2',
 radio:'M4.9 19.1C1 15.2 1 8.8 4.9 4.9|M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5|M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5|M19.1 4.9C23 8.8 23 15.1 19.1 19',

 shield:'M20 13c0 5-3.5 7.5-7.7 8.9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1.2 1.2 0 0 1 1.6 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z',
 warn:'m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3|M12 9v4|M12 17h.01',
 info:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20|M12 16v-4|M12 8h.01',

};
const Icon=({n,s=18,c=''})=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round',className:c,'aria-hidden':true},...P[n].split('|').map(d=>h('path',{key:d,d})));

/* ---------- Web Bluetooth link (micro:bit Nordic UART) ---------- */
const UART='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RXC='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TXC='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const enc=new TextEncoder(),dec=new TextDecoder(),wait=ms=>new Promise(r=>setTimeout(r,ms));
class MicroLink{

  this.device.addEventListener('gattserverdisconnected',()=>{this.pending.clear();this.onDisconnect&&this.onDisconnect()});
  const srv=await this.device.gatt.connect(),svc=await srv.getPrimaryService(UART);
  // micro:bit UART characteristics are the reverse of Nordic's naming, so pick them by what they can do.
  const chars=await svc.getCharacteristics();
  const tx=chars.find(c=>c.properties.notify||c.properties.indicate),rx=chars.find(c=>c.properties.write||c.properties.writeWithoutResponse);
  if(!tx||!rx)throw new Error('UART service found, but it has no notify/write characteristics. Re-flash the LOFI MakeCode program.');
  this.rx=rx;
  tx.addEventListener('characteristicvaluechanged',e=>{const t=dec.decode(e.target.value).trim();if(t&&this.onData)this.onData(t)});
  await tx.startNotifications();
  let battery=null;
  try{const b=await srv.getPrimaryService('battery_service');battery=(await(await b.getCharacteristic('battery_level')).readValue()).getUint8(0)}catch(_){}
  return{name:this.device.name||'micro:bit',battery};
 }
 disconnect(){this.pending.clear();if(this.device&&this.device.gatt.connected)this.device.gatt.disconnect()}
 send(t,key){this.pending.set(key==null?'_'+this.seq++:key,t);this.flush()}
 async flush(){
  if(this.busy)return;this.busy=true;
  while(this.pending.size){
   const [k,v]=this.pending.entries().next().value;this.pending.delete(k);
   if(!this.device.gatt.connected){this.pending.clear();break}
   try{const d=enc.encode(v);this.rx.properties.writeWithoutResponse&&this.rx.writeValueWithoutResponse?await this.rx.writeValueWithoutResponse(d):await this.rx.writeValue(d)}catch(e){this.onError&&this.onError(e.message)}
   await wait(25);
  }
  this.busy=false;

}

/* ---------- state: preferences + micro connection ---------- */
const DEF={speed:70,keyboard:true,newline:true},PK='lofi.prefs.v1';
const PrefsCtx=createContext(),MicroCtx=createContext();
const usePrefs=()=>useContext(PrefsCtx),useMicro=()=>useContext(MicroCtx);
function PrefsProvider({children}){
 const [prefs,set]=useState(()=>{try{return{...DEF,...JSON.parse(localStorage.getItem(PK)||'{}')}}catch(_){return DEF}});
 useEffect(()=>{try{localStorage.setItem(PK,JSON.stringify(prefs))}catch(_){}},[prefs]);
 const v=useMemo(()=>({prefs,setPref:(k,x)=>set(p=>({...p,[k]:x})),reset:()=>set(DEF)}),[prefs]);

}
function MicroProvider({children}){
 const {prefs}=usePrefs();
 const nl=useRef(prefs.newline);nl.current=prefs.newline;
 const link=useRef(null),lid=useRef(0);
 const [status,setStatus]=useState('disconnected'),[name,setName]=useState(null),[battery,setBattery]=useState(null),[error,setError]=useState(null),[sent,setSent]=useState(0),[log,setLog]=useState([]);
 const push=useCallback((type,text)=>setLog(l=>[{id:++lid.current,time:new Date(),type,text},...l].slice(0,60)),[]);
 const connect=useCallback(async()=>{
  if(!MicroLink.supported){setStatus('error');setError('Web Bluetooth is not available here. Use Chrome or Edge (desktop/Android) over https, or Bluefy on iOS.');return}
  setError(null);
  const l=new MicroLink({onData:t=>push('rx',t),onError:m=>push('error',m),onDisconnect:()=>{link.current=null;setStatus('disconnected');setName(null);setBattery(null);push('event','Disconnected')}});
  try{
   setStatus('connecting');const i=await l.connect();
   link.current=l;setName(i.name);setBattery(i.battery);setStatus('connected');push('event','Connected to '+i.name);
  }catch(e){
   l.disconnect();
   if(e.name==='NotFoundError'){setStatus('disconnected');push('event','Device selection cancelled');return}
   const blocked=e.name==='SecurityError'||e.name==='NotAllowedError';
   const m=blocked?'Bluetooth access was blocked. If this page is embedded in a preview, open it in its own browser tab. ('+e.message+')':e.message;
   setStatus('error');setError(m);push('error',m);
  }
 },[push]);
 const disconnect=useCallback(()=>link.current&&link.current.disconnect(),[]);
 const send=useCallback((cmd,o={})=>{
  if(!link.current)return false;
  link.current.send(cmd+(nl.current?'\n':''),o.key);setSent(n=>n+1);
  if(o.log!==false)push('tx',cmd);return true;

}

/* ---------- shared UI ---------- */
const Card=({title,icon,className='',children})=>h('section',{className:'glass p-5 '+className},
 title&&h('h2',{className:'mb-4 flex items-center gap-2 text-sm font-semibold text-slate-100'},icon&&h(Icon,{n:icon,s:16,c:'text-neon'}),title),children);
const TONE={connected:['bg-emerald-400','text-emerald-300','Connected'],connecting:['bg-amber-400 animate-pulse','text-amber-300','Connecting…'],disconnected:['bg-slate-500','text-slate-400','Disconnected'],error:['bg-rose-400','text-rose-300','Error']};
const Badge=({status})=>{const [d,t,l]=TONE[status];return h('span',{className:'inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs font-medium '+t},h('span',{className:'h-2 w-2 rounded-full '+d}),l)};
const Stat=({icon,label,value,hint})=>h('div',{className:'glass p-4 hover:-translate-y-0.5'},
 h('div',{className:'mb-3 flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-electric/30 to-violet/30 text-neon'},h(Icon,{n:icon})),
 h('p',{className:'text-xs text-slate-400'},label),h('p',{className:'mt-0.5 truncate text-xl font-semibold text-white'},value),h('p',{className:'mt-1 truncate text-xs text-slate-500'},hint));
const Toggle=({checked,onChange,label,desc})=>h('div',{className:'flex items-center justify-between gap-4 py-3'},
 h('div',null,h('p',{className:'text-sm font-medium text-slate-100'},label),h('p',{className:'text-xs text-slate-400'},desc)),
 h('button',{role:'switch','aria-checked':checked,'aria-label':label,onClick:()=>onChange(!checked),className:'relative h-6 w-11 shrink-0 rounded-full transition '+(checked?'bg-electric':'bg-white/15')},
  h('span',{className:'absolute top-0.5 h-5 w-5 rounded-full bg-white transition-all '+(checked?'left-[22px]':'left-0.5')})));
function ConnectionControls(){
 const m=useMicro(),busy=m.status==='connecting';
 return h('div',{className:'flex flex-wrap gap-2'},
  h('button',{className:'btn btn-p',onClick:m.connect,disabled:busy||m.connected},h(Icon,{n:'bt',s:16}),busy?'Connecting…':'Connect Micro'),
  h('button',{className:'btn btn-g',onClick:m.disconnect,disabled:!m.connected},h(Icon,{n:'x',s:16}),'Disconnect'));
}
function ErrorBanner(){
 const m=useMicro(),msg=m.error||(!m.supported&&'Web Bluetooth is not available in this browser. Use Chrome or Edge over https, or Bluefy on iOS.');
 return msg?h('div',{role:'alert',className:'flex items-start gap-3 rounded-xl border border-rose-400/30 bg-rose-500/10 p-4 text-sm text-rose-200'},h(Icon,{n:'warn',c:'mt-0.5 shrink-0'}),h('p',null,msg)):null;
}
const Head=({title,sub,children})=>h('header',{className:'flex flex-wrap items-start justify-between gap-4'},
 h('div',null,h('h1',{className:'text-3xl font-bold tracking-tight text-white'},title),h('p',{className:'mt-1 text-slate-400'},sub)),children);

/* ---------- controller widgets ---------- */
function Joystick({label,onChange,disabled,accent,size=200}){
 const base=useRef(null),[pos,setPos]=useState({x:0,y:0}),[on,setOn]=useState(false),R=size/2-32;
 const upd=e=>{
  const r=base.current.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d}
  const n={x:dx/R,y:-dy/R};setPos(n);onChange(n);
 };
 const rel=()=>{if(!on)return;setOn(false);setPos({x:0,y:0});onChange({x:0,y:0})};
 const col=accent==='violet'?'#8b5cf6':'#22d3ee';
 return h('div',{className:'flex flex-col items-center gap-3'},
  h('div',{ref:base,role:'application','aria-label':label+' joystick',className:'nt relative rounded-full border border-white/10 '+(disabled?'opacity-40':'cursor-grab'),style:{width:size,height:size,background:'linear-gradient(180deg,rgba(255,255,255,.06),transparent)'},
   onPointerDown:e=>{if(disabled)return;e.currentTarget.setPointerCapture(e.pointerId);setOn(true);upd(e)},onPointerMove:e=>on&&upd(e),onPointerUp:rel,onPointerCancel:rel},
   h('div',{className:'absolute inset-4 rounded-full border border-dashed border-white/10'}),
   h('div',{className:'absolute left-1/2 top-4 h-[calc(100%-2rem)] w-px bg-white/10'}),
   h('div',{className:'absolute left-4 top-1/2 h-px w-[calc(100%-2rem)] bg-white/10'}),
   h('div',{className:'absolute left-1/2 top-1/2 h-16 w-16 -ml-8 -mt-8 rounded-full bg-ink',style:{border:'2px solid '+col,boxShadow:'0 0 24px '+col+'66',transform:`translate(${pos.x*R}px,${-pos.y*R}px)`,transition:on?'none':'transform .2s'}})),
  h('p',{className:'font-mono text-xs text-slate-400'},`${label} · x ${pos.x.toFixed(2)} · y ${pos.y.toFixed(2)}`));
}
const Slider=({label,ch,value,min=0,max=180,onChange,disabled})=>h('div',null,
 h('div',{className:'mb-2 flex items-baseline justify-between'},h('label',{htmlFor:'s'+label,className:'text-sm font-medium text-slate-100'},label),h('span',{className:'font-mono text-xs text-neon'},ch+value)),

function DPad({dir,onDir,onHorn,onStop,disabled}){
 const cell='nt flex h-14 w-14 items-center justify-center rounded-xl border transition active:scale-95 disabled:opacity-40 ';
 const b=(d,pos)=>h('button',{key:d,'aria-label':d,disabled,className:cell+pos+' '+(dir===d?'border-neon bg-neon/20 text-neon':'border-white/10 bg-white/5 text-slate-300 hover:bg-white/10'),
  onPointerDown:()=>onDir(d),onPointerUp:()=>onDir('stop'),onPointerLeave:()=>dir===d&&onDir('stop'),onPointerCancel:()=>onDir('stop')},h(Icon,{n:d,s:24}));

  h('div',{className:'grid grid-cols-3 gap-2'},b('up','col-start-2'),b('left','col-start-1 row-start-2'),
   h('button',{'aria-label':'Stop',disabled,onClick:onStop,className:cell+'col-start-2 row-start-2 border-rose-400/40 bg-rose-500/15 text-rose-300'},h(Icon,{n:'stop',s:18})),
   b('right','col-start-3 row-start-2'),b('down','col-start-2 row-start-3')),
  h('button',{disabled,className:'btn btn-g nt',onPointerDown:()=>onHorn(true),onPointerUp:()=>onHorn(false),onPointerLeave:()=>onHorn(false)},h(Icon,{n:'vol',s:16}),'Hold for horn'));
}

/* ---------- pages (one per tab) ---------- */
const LS={tx:'text-cyan-300',rx:'text-violet-300',event:'text-slate-300',error:'text-rose-300'},LL={tx:'sent',rx:'received',event:'event',error:'error'};
const Row=(k,v)=>h('div',{key:k,className:'flex items-center justify-between gap-3 border-b border-white/5 pb-2 last:border-0'},h('dt',{className:'text-slate-400'},k),h('dd',{className:'truncate text-slate-100'},v));

function DashboardPage({navigate}){
 const m=useMicro();
 const sys=!m.supported?'Unsupported':m.status==='error'?'Error':m.status==='connecting'?'Connecting':'Ready';
 return h('div',{className:'space-y-6'},
  h(Head,{title:'Welcome to LOFI Control',sub:'Your smart control center for Micro.'},h(Badge,{status:m.status})),
  h(ErrorBanner),
  h('div',{className:'grid grid-cols-2 gap-4 lg:grid-cols-4'},
   h(Stat,{icon:'cpu',label:'Device status',value:m.connected?'Online':'Offline',hint:m.name||'No device paired'}),
   h(Stat,{icon:'radio',label:'Connection type',value:m.connected?'Bluetooth LE':'—',hint:m.connected?'Nordic UART service':'Not connected'}),
   h(Stat,{icon:'send',label:'Commands sent',value:m.sent,hint:'This session'}),
   h(Stat,{icon:'shield',label:'System status',value:sys,hint:m.supported?'Web Bluetooth available':'Web Bluetooth missing'})),
  h('div',{className:'grid gap-4 lg:grid-cols-3'},
   h(Card,{title:'Device overview',icon:'cpu'},h('dl',{className:'space-y-3 text-sm'},
    Row('Device',m.name||'Not connected'),Row('Bluetooth',m.connected?'Connected':m.status==='connecting'?'Pairing…':'Disconnected'),
    Row('Battery',m.battery!=null?m.battery+'%':m.connected?'Not reported by firmware':'—'))),
   h(Card,{title:'Quick controls',icon:'pad',className:'lg:col-span-2'},
    h('div',{className:'flex flex-wrap items-center gap-2'},h(ConnectionControls),h('button',{className:'btn btn-g',onClick:()=>navigate('controller')},h(Icon,{n:'pad',s:16}),'Open Controller')),
    h('p',{className:'mt-3 text-xs text-slate-500'},'The Micro must run the LOFI UART Bluetooth program with “No pairing required”.'))),
  h(Card,{title:'Live activity',icon:'act'},m.log.length===0
   ?h('p',{className:'py-6 text-sm text-slate-500'},'No activity yet. Connect your Micro to begin.')
   :h('ul',{className:'max-h-72 space-y-1 overflow-y-auto font-mono text-xs'},m.log.map(e=>h('li',{key:e.id,className:'flex gap-3 rounded-lg px-2 py-1.5 hover:bg-white/5'},
     h('time',{className:'shrink-0 text-slate-500'},e.time.toLocaleTimeString([],{hour12:false})),h('span',{className:'w-16 shrink-0 '+LS[e.type]},LL[e.type]),h('span',{className:'min-w-0 break-words text-slate-200'},e.text))))));
}

const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
function ControllerPage(){
 const {status,connected,send,connect}=useMicro(),{prefs,setPref}=usePrefs();
 const [dir,setDirS]=useState('stop'),[sl,setSl]=useState({c:90,x:90});
 const lastDir=useRef('stop'),lastSl=useRef({});
 // Protocol: up/down/left/right/horn/stop · slider 1 = c0..c180 · slider 2 = x0..x180
 const setDir=useCallback(d=>{if(lastDir.current===d)return;lastDir.current=d;setDirS(d);send(d,{key:'dir'})},[send]);
 const setSlider=useCallback((ch,v)=>{if(lastSl.current[ch]===v)return;lastSl.current[ch]=v;setSl(s=>({...s,[ch]:v}));send(ch+v,{key:ch,log:false})},[send]);
 useEffect(()=>{lastDir.current='stop';lastSl.current={};setDirS('stop')},[connected]);
 const onLeft=({x,y})=>Math.hypot(x,y)<.35?setDir('stop'):setDir(Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'up':'down'));

 useEffect(()=>{
  if(!connected||!prefs.keyboard)return;
  const typing=e=>e.target.tagName==='INPUT'&&e.target.type!=='range';
  const dn=e=>{if(KEYS[e.key]&&!e.repeat&&!typing(e)){e.preventDefault();setDir(KEYS[e.key])}};
  const up=e=>{if(KEYS[e.key]&&!typing(e))setDir('stop')};
  addEventListener('keydown',dn);addEventListener('keyup',up);
  return()=>{removeEventListener('keydown',dn);removeEventListener('keyup',up)};
 },[connected,prefs.keyboard,setDir]);
 const off=!connected;
 return h('div',{className:'space-y-6'},
  h(Head,{title:'Micro Controller',sub:'Drive with the left stick, steer servos with the right stick or sliders.'},
   h('div',{className:'flex flex-wrap items-center gap-3'},h(Badge,{status}),h(ConnectionControls))),
  h(ErrorBanner),
  off&&h('div',{className:'glass flex flex-wrap items-center justify-between gap-3 p-4 text-sm'},h('p',{className:'text-slate-300'},'Controls are locked until a Micro is connected over Bluetooth.'),
   h('button',{className:'btn btn-p',onClick:connect,disabled:status==='connecting'},h(Icon,{n:'bt',s:16}),'Connect Micro')),
  h('div',{className:'grid gap-4 lg:grid-cols-3'},
   h(Card,{title:'Movement',className:'flex flex-col items-center'},h(Joystick,{label:'Left',onChange:onLeft,disabled:off}),h('p',{className:'mt-3 text-xs text-slate-400'},'Sends ',h('span',{className:'font-mono text-neon'},dir))),
   h(Card,{title:'Directional pad',className:'flex flex-col items-center justify-between gap-6'},
    h(DPad,{dir,onDir:setDir,onHorn:d=>send(d?'horn':'stop',{key:'horn'}),onStop:()=>setDir('stop'),disabled:off}),
    h('button',{className:'btn btn-d w-full',disabled:off,onClick:()=>{lastDir.current='';setDir('stop')}},h(Icon,{n:'stop',s:14}),'Stop')),
   h(Card,{title:'Actions',className:'flex flex-col items-center'},h(Joystick,{label:'Right',accent:'violet',onChange:onRight,disabled:off}),
    h('p',{className:'mt-3 text-xs text-slate-400'},'X → c'+sl.c+' · Y → x'+sl.x))),
  h('div',{className:'grid gap-4 md:grid-cols-2'},
   h(Card,{title:'Sliders (0–180)',className:'space-y-5'},h(Slider,{label:'Slider 1',ch:'c',value:sl.c,onChange:v=>setSlider('c',v),disabled:off}),h(Slider,{label:'Slider 2',ch:'x',value:sl.x,onChange:v=>setSlider('x',v),disabled:off})),
   h(Card,{title:'Speed',icon:'act'},h(Slider,{label:'Right stick range',ch:'',value:prefs.speed,min:10,max:100,onChange:v=>setPref('speed',v)}),
    h('p',{className:'mt-3 text-xs text-slate-500'},'Limits how far the right stick moves the sliders from 90. Saved on this device.'))));
}

function SettingsPage(){
 const {prefs,setPref,reset}=usePrefs();
 return h('div',{className:'space-y-6'},h(Head,{title:'Settings',sub:'Preferences are saved in this browser.'}),
  h(Card,{title:'Controller',className:'max-w-2xl'},
   h(Toggle,{label:'Keyboard arrows',desc:'Drive with the arrow keys while connected.',checked:prefs.keyboard,onChange:v=>setPref('keyboard',v)}),
   h(Toggle,{label:'Append newline to commands',desc:'Most MakeCode UART programs expect a newline. Turn off if yours does not.',checked:prefs.newline,onChange:v=>setPref('newline',v)}),
   h('div',{className:'pt-3'},h('button',{className:'btn btn-g',onClick:reset},h(Icon,{n:'rot',s:16}),'Reset preferences'))));
}

/* ---------- tab registry: add one entry to add a tab ---------- */
const TABS=[
 {id:'dashboard',label:'Dashboard',icon:'dash',component:DashboardPage},
 {id:'controller',label:'Micro Controller',icon:'pad',component:ControllerPage},
 {id:'settings',label:'Settings',icon:'cog',component:SettingsPage}
];

function Sidebar({active,onSelect}){
 const item=(t,mobile)=>{const on=t.id===active;return h('button',{key:t.id,onClick:()=>onSelect(t.id),'aria-current':on?'page':undefined,
  className:mobile?'flex flex-1 flex-col items-center gap-1 rounded-xl py-2 text-[11px] font-medium transition '+(on?'text-neon':'text-slate-400')
   :'flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium transition '+(on?'bg-gradient-to-r from-electric/25 to-neon/10 text-white ring-1 ring-neon/30':'text-slate-400 hover:bg-white/5 hover:text-white')},
  h(Icon,{n:t.icon,s:mobile?20:18,c:on?'text-neon':''}),mobile?t.label.replace('Micro ',''):t.label)};
 return h(React.Fragment,null,
  h('aside',{className:'glass fixed inset-y-0 left-0 z-30 hidden w-64 flex-col !rounded-none border-y-0 border-l-0 p-4 md:flex'},
   h('div',{className:'mb-8 flex items-center gap-3 px-2 pt-2'},
    h('div',{className:'flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-electric via-neon to-violet text-ink'},h(Icon,{n:'bot',s:22})),
    h('div',null,h('p',{className:'text-lg font-bold leading-none text-white'},'LOFI'),h('p',{className:'mt-1 text-xs text-slate-400'},'Micro Control'))),
   h('nav',{className:'flex flex-1 flex-col gap-1','aria-label':'Main'},TABS.map(t=>item(t,false))),
   h('a',{href:'https://cardboard.lofirobot.com/microbit-control-app-info/',target:'_blank',rel:'noreferrer',className:'flex items-center gap-3 rounded-xl border border-white/10 bg-white/5 p-3 transition hover:border-white/20'},
    h('div',{className:'flex h-9 w-9 items-center justify-center rounded-full bg-violet/30 text-violet-200'},h(Icon,{n:'info',s:16})),
    h('div',{className:'min-w-0'},h('p',{className:'truncate text-sm font-medium text-white'},'LOFI Operator'),h('p',{className:'text-xs text-slate-400'},'About · v1.0')))),
  h('nav',{className:'glass fixed inset-x-0 bottom-0 z-30 flex justify-around !rounded-none border-x-0 border-b-0 px-2 pt-2 md:hidden',style:{paddingBottom:'env(safe-area-inset-bottom,0px)'},'aria-label':'Main'},TABS.map(t=>item(t,true))));
}

function App(){
 const [active,setActive]=useState(TABS[0].id); // Dashboard is the default
 const Page=(TABS.find(t=>t.id===active)||TABS[0]).component;
 return h('div',{className:'min-h-screen'},h(Sidebar,{active,onSelect:setActive}),
  h('main',{className:'pb-24 md:pb-0 md:pl-64'},h('div',{key:active,className:'page mx-auto max-w-6xl p-4 sm:p-6 lg:p-8'},h(Page,{navigate:setActive}))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(PrefsProvider,null,h(MicroProvider,null,h(App))));
})();
</script>
</body>
</html>
