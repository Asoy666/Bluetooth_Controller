<script>
(()=>{
const {useState,useRef,useEffect,useCallback,useMemo,createContext,useContext}=React;
const h=React.createElement;

/* ---------- icons (Lucide paths) ---------- */
const P={

};
const Icon=({n,s=18,c=''})=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round',className:c,'aria-hidden':true},...P[n].split('|').map(d=>h('path',{key:d,d})));

/* ---------- Web Bluetooth link (micro:bit Nordic UART) ---------- */
const UART='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RXC='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TXC='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
/* ---------- Micro Data Settings: ONE shared config drives every command the app sends ---------- */
// TRANSPORTER = factory defaults. The live values are cfg.trans (edited in Micro Data Settings, saved in localStorage).
const TRANSPORTER={open:'o',close:'c',stop:'s',travelMs:1200,fbOpen:['opened','open'],fbClosed:['closed','close']};
const CFG_DEF={
 move:{up:'up',down:'down',left:'left',right:'right',stop:'stop',horn:'horn'},
 servo:{p1:'c',p2:'x',min1:0,max1:180,min2:0,max2:180,def:90},
 trans:TRANSPORTER,
 tx:{newline:true,delim:'',delay:25,log:true,mode:'auto',chunk:20}
};
const CK='lofi.cfg.v1',clone=o=>JSON.parse(JSON.stringify(o)),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const NAMES={up:'Forward',down:'Backward',left:'Left',right:'Right',stop:'Stop',horn:'Horn'};
const ASCII=/^[\x20-\x7E]+$/,CfgCtx=createContext(),useCfg=()=>useContext(CfgCtx);
const toForm=c=>({move:{...c.move},servo:Object.fromEntries(Object.entries(c.servo).map(([k,v])=>[k,String(v)])),
 trans:{open:c.trans.open,close:c.trans.close,stop:c.trans.stop,travelMs:String(c.trans.travelMs),fbOpen:[].concat(c.trans.fbOpen).join(', '),fbClosed:[].concat(c.trans.fbClosed).join(', ')},
 tx:{newline:!!c.tx.newline,delim:String(c.tx.delim),delay:String(c.tx.delay),log:!!c.tx.log,mode:c.tx.mode,chunk:String(c.tx.chunk)}});
const num=v=>{const x=+String(v).trim();return Number.isFinite(x)?x:0},list=v=>String(v).split(',').map(a=>a.trim().toLowerCase()).filter(Boolean);
const fromForm=f=>({move:Object.fromEntries(Object.entries(f.move).map(([k,v])=>[k,String(v)])),
 servo:{p1:f.servo.p1,p2:f.servo.p2,min1:num(f.servo.min1),max1:num(f.servo.max1),min2:num(f.servo.min2),max2:num(f.servo.max2),def:num(f.servo.def)},
 trans:{open:f.trans.open,close:f.trans.close,stop:f.trans.stop,travelMs:num(f.trans.travelMs),fbOpen:list(f.trans.fbOpen),fbClosed:list(f.trans.fbClosed)},
 tx:{newline:!!f.tx.newline,delim:f.tx.delim,delay:num(f.tx.delay),log:!!f.tx.log,mode:f.tx.mode,chunk:num(f.tx.chunk)}});
const cmdErr=(v,empty)=>{v=String(v);return !v?(empty?null:'Enter a command'):!ASCII.test(v)?'Use printable characters only':v!==v.trim()?'Remove spaces at the start or end':v.length>20?'Use 20 characters or fewer':null};
const numErr=(v,lo,hi)=>{v=String(v).trim();return !/^\d+$/.test(v)?'Enter a whole number':(+v<lo||+v>hi)?'Use '+lo+' to '+hi:null};
function validate(f){
 const e={},w=[],{move:m,servo:s,trans:t,tx:x}=f,E=(k,r)=>{if(r&&!e[k])e[k]=r},seen={};
 Object.keys(NAMES).forEach(k=>{const r=cmdErr(m[k]);E('move.'+k,r);if(!r){if(seen[m[k]])E('move.'+k,'Already used by '+NAMES[seen[m[k]]]);else seen[m[k]]=k}});
 ['p1','p2'].forEach(k=>E('servo.'+k,cmdErr(s[k])||(/\d$/.test(s[k])?'Cannot end in a digit; it would merge with the value':null)));
 if(!e['servo.p1']&&!e['servo.p2']&&s.p1===s.p2)E('servo.p2','Must differ from Slider 1');
 const R=[['min1','max1'],['min2','max2']];
 R.forEach(([a,b])=>{E('servo.'+a,numErr(s[a],0,999));E('servo.'+b,numErr(s[b],0,999));if(!e['servo.'+a]&&!e['servo.'+b]&&+s[a]>=+s[b])E('servo.'+b,'Must be above the minimum')});
 E('servo.def',numErr(s.def,0,999));
 if(!e['servo.def'])R.forEach(([a,b],i)=>{if(!e['servo.'+a]&&!e['servo.'+b]&&(+s.def<+s[a]||+s.def>+s[b]))E('servo.def','Must sit inside the Slider '+(i+1)+' range')});
 ['open','close','stop'].forEach(k=>E('trans.'+k,cmdErr(t[k],k==='stop')));
 ['close','stop'].forEach(k=>{if(t[k]&&t[k]===t.open)E('trans.'+k,'Must differ from Open')});
 if(t.stop&&t.stop===t.close)E('trans.stop','Must differ from Close');
 E('trans.travelMs',numErr(t.travelMs,100,30000));
 const fo=list(t.fbOpen),fc=list(t.fbClosed);
 [['fbOpen',fo],['fbClosed',fc]].forEach(([k,l])=>E('trans.'+k,l.map(a=>cmdErr(a)).find(Boolean)));
 const both=fo.find(a=>fc.includes(a));E('trans.fbClosed',both&&'“'+both+'” is in both lists');
 E('tx.delim',/^[\x21-\x7E]{0,3}$/.test(x.delim)?null:'Use up to 3 visible characters, no spaces');
 E('tx.delay',numErr(x.delay,0,2000));E('tx.chunk',numErr(x.chunk,1,244));
 if(!['auto','withResponse','withoutResponse'].includes(x.mode))E('tx.mode','Pick a write mode');
 const all=[...Object.values(m),s.p1,s.p2,t.open,t.close,t.stop].map(String).filter(Boolean),hit=x.delim&&all.find(c=>c.includes(x.delim));
 E('tx.delim',hit&&'“'+x.delim+'” appears inside the command “'+hit+'”');
 if(!x.newline&&!x.delim)w.push('No newline or delimiter: messages run together (“upstop”) and a bare “c” cannot be told apart from “c90”. Your micro must read a continuous stream.');
 [t.open,t.close,t.stop].filter(c=>c&&Object.values(m).includes(c)).forEach(c=>w.push('“'+c+'” is used by both Movement and Transporter.'));
 return{errors:e,warnings:[...new Set(w)]};
}
// the one place that builds bytes for the micro: used by send() AND by every preview
const fmtParts=(c,tx,bare)=>{const p=[{k:'cmd',raw:c,show:c}];if(!bare){if(tx.delim)p.push({k:'delim',raw:tx.delim,show:tx.delim});if(tx.newline)p.push({k:'nl',raw:'\n',show:'\\n'})}return p};
const fmtPayload=(c,tx,bare)=>fmtParts(c,tx,bare).map(p=>p.raw).join('');
const linkOpts=tx=>({delay:tx.delay,mode:tx.mode,chunk:tx.chunk});
function CfgProvider({children}){
 const [cfg,set]=useState(()=>{try{
  const raw=localStorage.getItem(CK),j=raw?JSON.parse(raw):{},c={};
  Object.keys(CFG_DEF).forEach(k=>c[k]={...clone(CFG_DEF[k]),...(j[k]&&typeof j[k]==='object'?j[k]:{})});
  if(!raw){try{if(JSON.parse(localStorage.getItem(PK)||'{}').newline===false)c.tx.newline=false}catch(_){}} // keep the old newline preference
  const f=toForm(c);return Object.keys(validate(f).errors).length?clone(CFG_DEF):fromForm(f);
 }catch(_){return clone(CFG_DEF)}});
 const save=useCallback(c=>{set(c);try{localStorage.setItem(CK,JSON.stringify(c));return true}catch(_){return false}},[]);
 const v=useMemo(()=>({cfg,save,reset:()=>save(clone(CFG_DEF))}),[cfg,save]);
 return h(CfgCtx.Provider,{value:v},children);
}
const enc=new TextEncoder(),dec=new TextDecoder(),wait=ms=>new Promise(r=>setTimeout(r,ms));
class MicroLink{
 static get supported(){return 'bluetooth' in navigator}
 constructor(cb){Object.assign(this,cb);this.pending=new Map();this.busy=false;this.seq=0;this.opts={delay:25,mode:'auto',chunk:20}}
 async connect(){
  this.device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'BBC micro:bit'},{services:[UART]}],optionalServices:[UART,'battery_service']});
  this.device.addEventListener('gattserverdisconnected',()=>{this.failAll('Disconnected');this.onDisconnect&&this.onDisconnect()});
  const srv=await this.device.gatt.connect(),svc=await srv.getPrimaryService(UART);
  // micro:bit UART characteristics are the reverse of Nordic's naming, so pick them by what they can do.
  const chars=await svc.getCharacteristics();
  const tx=chars.find(c=>c.properties.notify||c.properties.indicate),rx=chars.find(c=>c.properties.write||c.properties.writeWithoutResponse);
  if(!tx||!rx)throw new Error('UART service found, but it has no notify/write characteristics. Re-flash your MakeCode UART program.');
  this.rx=rx;
  tx.addEventListener('characteristicvaluechanged',e=>{const t=dec.decode(e.target.value).trim();if(t&&this.onData)this.onData(t)});
  await tx.startNotifications();
  let battery=null;
  try{const b=await srv.getPrimaryService('battery_service');battery=(await(await b.getCharacteristic('battery_level')).readValue()).getUint8(0)}catch(_){}
  return{name:this.device.name||'micro:bit',battery};
 }
 disconnect(){this.failAll('Disconnected');if(this.device&&this.device.gatt.connected)this.device.gatt.disconnect()}
 failAll(msg){const p=[...this.pending.values()];this.pending.clear();p.forEach(v=>v.done&&v.done(msg))}
 send(t,key,done){this.pending.set(key==null?'_'+this.seq++:key,{t,done});this.flush()}
 async write(text){
  const rx=this.rx,o=this.opts,d=enc.encode(text),n=Math.max(1,o.chunk|0);
  const canNo=!!(rx.properties.writeWithoutResponse&&rx.writeValueWithoutResponse),canYes=!!rx.properties.write;
  const noResp=o.mode==='withResponse'?!canYes:canNo; // "auto" = original behaviour; a forced mode falls back if unsupported
  for(let i=0;i<d.length;i+=n){
   if(i)await wait(o.delay);
   const p=d.slice(i,i+n);
   await(noResp?rx.writeValueWithoutResponse(p):rx.writeValueWithResponse?rx.writeValueWithResponse(p):rx.writeValue(p));
  }
 }
 async flush(){
  if(this.busy)return;this.busy=true;
  while(this.pending.size){
   const [k,v]=this.pending.entries().next().value;this.pending.delete(k);
   if(!this.device||!this.rx||!this.device.gatt.connected){v.done&&v.done('Not connected');this.failAll('Not connected');break}
   let err=null;
   try{await this.write(v.t)}catch(e){err=e.message||String(e);this.onError&&this.onError(err)}
   v.done&&v.done(err);
   await wait(this.opts.delay);
  }
  this.busy=false;
 }
}

/* ---------- state: preferences + micro connection ---------- */
const DEF={speed:70,keyboard:true,newline:true},PK='lofi.prefs.v1';
const PrefsCtx=createContext(),MicroCtx=createContext();
const usePrefs=()=>useContext(PrefsCtx),useMicro=()=>useContext(MicroCtx);
function PrefsProvider({children}){
 const [prefs,set]=useState(()=>{try{return{...DEF,...JSON.parse(localStorage.getItem(PK)||'{}')}}catch(_){return DEF}});
 useEffect(()=>{try{localStorage.setItem(PK,JSON.stringify(prefs))}catch(_){}},[prefs]);
 const v=useMemo(()=>({prefs,setPref:(k,x)=>set(p=>({...p,[k]:x})),reset:()=>set(DEF)}),[prefs]);
 return h(PrefsCtx.Provider,{value:v},children);
}
function MicroProvider({children}){
 const {cfg}=useCfg(),cr=useRef(cfg);cr.current=cfg; // always read the latest saved settings
 const link=useRef(null),lid=useRef(0);
 const [status,setStatus]=useState('disconnected'),[name,setName]=useState(null),[battery,setBattery]=useState(null),[error,setError]=useState(null),[sent,setSent]=useState(0),[log,setLog]=useState([]);
 const push=useCallback((type,text)=>setLog(l=>[{id:++lid.current,time:new Date(),type,text},...l].slice(0,60)),[]);
 const connect=useCallback(async()=>{
  if(!MicroLink.supported){setStatus('error');setError('Web Bluetooth is not available here. Use Chrome or Edge (desktop/Android) over https, or Bluefy on iOS.');return}
  setError(null);
  const l=new MicroLink({onData:t=>push('rx',t),onError:m=>push('error',m),onDisconnect:()=>{link.current=null;setStatus('disconnected');setName(null);setBattery(null);push('event','Disconnected')}});
  try{
   setStatus('connecting');const i=await l.connect();
   link.current=l;setName(i.name);setBattery(i.battery);setStatus('connected');push('event','Connected to '+i.name);
  }catch(e){
   l.disconnect();
   if(e.name==='NotFoundError'){setStatus('disconnected');push('event','Device selection cancelled');return}
   const blocked=e.name==='SecurityError'||e.name==='NotAllowedError';
   const m=blocked?'Bluetooth access was blocked. If this page is embedded in a preview, open it in its own browser tab. ('+e.message+')':e.message;
   setStatus('error');setError(m);push('error',m);
  }
 },[push]);
 const disconnect=useCallback(()=>link.current&&link.current.disconnect(),[]);
 const send=useCallback((cmd,o={})=>{
  const l=link.current;if(!l)return false;
  const tx=cr.current.tx;
  try{l.opts=linkOpts(tx);l.send(fmtPayload(cmd,tx,o.raw),o.key,o.done)}catch(e){push('error','Send failed: '+e.message);return false}
  setSent(n=>n+1);
  if(o.log!==false&&tx.log)push('tx',cmd);return true;
 },[push]);
 useEffect(()=>{if(link.current)link.current.opts=linkOpts(cfg.tx)},[cfg.tx]);
 useEffect(()=>()=>link.current&&link.current.disconnect(),[]);
 const v=useMemo(()=>({status,name,battery,error,sent,log,push,connect,disconnect,send,supported:MicroLink.supported,connected:status==='connected'}),[status,name,battery,error,sent,log,push,connect,disconnect,send]);
 return h(MicroCtx.Provider,{value:v},children);
}

/* ---------- error boundary: a crash shows its message instead of a blank page ---------- */
class Boundary extends React.Component{
 constructor(p){super(p);this.state={e:null}}
 static getDerivedStateFromError(e){return{e}}
 componentDidCatch(e){console.error('microbit control web UI error:',e)}
 render(){
  const e=this.state.e;
  return e?h('div',{role:'alert',className:'rounded-xl border border-rose-400/30 bg-rose-500/10 p-4 text-sm text-rose-200'},
   h('p',{className:'font-semibold'},'Something went wrong in this section.'),
   h('p',{className:'mt-1 break-words font-mono text-xs'},String((e&&e.message)||e)),
   h('button',{className:'btn btn-g mt-3',onClick:()=>this.setState({e:null})},'Try again')):this.props.children;

 const go=()=>{
  if(!connected||!text||err)return;
  const id=++idc.current,payload=fmtPayload(text,tx,!fmt),bytes=enc.encode(payload).length,up=p=>setHist(a=>a.map(x=>x.id===id?{...x,...p}:x));
  setBase(lr.current.length?lr.current[0].id:0);
  setHist(a=>[{id,parts:fmtParts(text,tx,!fmt),bytes,packets:Math.ceil(bytes/tx.chunk),status:'sending',time:new Date()},...a].slice(0,5));
  if(!send(text,{raw:!fmt,done:e=>up({status:e?'fail':'ok',err:e})}))up({status:'fail',err:'Not connected'});
 };

  h('div',{className:'space-y-4'},
   h(Field,{id:'tt-in',label:'Custom command',error:err,hint:'Press Enter to send.'},h(Inp,{id:'tt-in',value:text,onChange:setText,error:err,placeholder:'e.g. up',maxLength:100,onKeyDown:e=>e.key==='Enter'&&go()})),
   h(Toggle,{label:'Add delimiter and newline',desc:'Use the saved transmission format. Turn off to send the text exactly as typed.',checked:fmt,onChange:setFmt}),
   h('div',{className:'rounded-xl border border-white/10 bg-white/5 p-3 text-xs text-slate-400'},'Will send ',text?h(PartsView,{parts:fmtParts(text,tx,!fmt)}):'nothing yet'),
   h('div',{className:'flex flex-wrap items-center gap-3'},h('button',{className:'btn btn-p',disabled:!connected||!text||!!err,onClick:go},h(Icon,{n:'send',s:16}),'Send Test Command'),!connected&&h('span',{className:'text-xs text-slate-500'},'Connect a Micro to send.')),
   dirtyTx&&h('p',{className:'text-xs text-amber-300'},'You have unsaved transmission changes. The tester uses the saved ones.'),
   hist.length>0&&h('ul',{className:'space-y-2','aria-live':'polite'},hist.map(x=>h('li',{key:x.id,className:'flex flex-wrap items-center justify-between gap-2 rounded-xl border border-white/10 bg-white/5 px-3 py-2'},
    h('span',null,h(PartsView,{parts:x.parts}),h('span',{className:'ml-2 text-xs text-slate-500'},x.bytes+' B · '+x.packets+(x.packets>1?' packets':' packet')+' · '+x.time.toLocaleTimeString([],{hour12:false}))),
    h(Pill,{s:x.status}),x.err&&h('p',{className:'w-full text-xs text-rose-300'},x.err))))),
  h('div',null,h('p',{className:'mb-2 text-xs font-medium text-slate-300'},'Incoming Bluetooth responses'),
   rx.length?h('ul',{className:'space-y-1 font-mono text-xs'},rx.map(e=>h('li',{key:e.id,className:'flex gap-3 rounded-lg px-2 py-1.5 '+(hist.length&&e.id>base?'bg-violet/10':'')},
     h('time',{className:'shrink-0 text-slate-500'},e.time.toLocaleTimeString([],{hour12:false})),h('span',{className:'break-words text-violet-300'},e.text))))
   :h('p',{className:'text-sm text-slate-500'},'No responses yet. Replies appear here when your micro writes to its UART.'))));
}

function MicroDataPage(){
 const m=useMicro(),{cfg,save,reset}=useCfg();

 const saved=useMemo(()=>toForm(cfg),[cfg]),dirty=JSON.stringify(f)!==JSON.stringify(saved),dirtyTx=JSON.stringify(f.tx)!==JSON.stringify(saved.tx);
 const {errors:E,warnings}=useMemo(()=>validate(f),[f]),nErr=Object.keys(E).length;
 const set=(s,k,v)=>{setF(p=>({...p,[s]:{...p[s],[k]:v}}));setMsg('')};
 const fld=(s,k,label,hint,o={})=>h(Field,{key:k,id:s+'-'+k,label,hint,error:E[s+'.'+k]},h(Inp,{id:s+'-'+k,value:f[s][k],error:E[s+'.'+k],onChange:v=>set(s,k,v),...o}));
 const doSave=()=>{if(nErr||!dirty)return;const c=fromForm(f),ok=save(c);setF(toForm(c));setMsg(ok?'Saved. The controller now sends these commands.':'Applied, but this browser blocked saving, so it will not survive a refresh.')};
 const doReset=()=>{
  if(!arm){setArm(true);clearTimeout(tm.current);tm.current=setTimeout(()=>setArm(false),4000);return}
  clearTimeout(tm.current);setArm(false);const ok=reset();setF(toForm(CFG_DEF));setMsg(ok?'Defaults restored and saved.':'Defaults restored for this session.');
 };
 useEffect(()=>()=>clearTimeout(tm.current),[]);
 const sv=f.servo;

  h(Head,{title:'Micro Data Settings',sub:'Choose exactly what the controller sends to your micro:bit over Bluetooth UART.'},h('div',{className:'flex flex-wrap items-center gap-3'},h(Badge,{status:m.status}),h(ConnectionControls))),
  h(ErrorBanner),
  h('div',{className:'grid gap-4 lg:grid-cols-2'},
   h(Card,{title:'Movement Configuration',icon:'pad'},h('div',{className:'grid grid-cols-2 gap-4'},Object.keys(NAMES).map(k=>fld('move',k,NAMES[k],'Default “'+CFG_DEF.move[k]+'”')))),
   h(Card,{title:'Servo Configuration',icon:'cog'},h('div',{className:'grid grid-cols-2 gap-4'},
    fld('servo','p1','Slider 1 prefix','Sends “'+sv.p1+sv.def+'”'),fld('servo','p2','Slider 2 prefix','Sends “'+sv.p2+sv.def+'”'),
    fld('servo','min1','Slider 1 minimum',null,NI),fld('servo','max1','Slider 1 maximum',null,NI),
    fld('servo','min2','Slider 2 minimum',null,NI),fld('servo','max2','Slider 2 maximum',null,NI),
    fld('servo','def','Default servo position','Start value and stick centre',NI))),
   h(Card,{title:'Transporter Configuration',icon:'expand'},
    h('div',{className:'grid grid-cols-2 gap-4'},fld('trans','open','Open'),fld('trans','close','Close'),fld('trans','stop','Stop mechanism','Leave empty to disable STOP')),
    h('p',{className:'mb-3 mt-5 text-xs font-medium text-slate-300'},'Status feedback (optional)'),
    h('div',{className:'grid grid-cols-2 gap-4'},fld('trans','travelMs','Travel time (ms)','Shown as MOVING',NI),fld('trans','fbOpen','Replies meaning open','Comma separated'),fld('trans','fbClosed','Replies meaning closed','Comma separated'))),
   h(Card,{title:'Transmission Settings',icon:'send'},
    h(Toggle,{label:'Append newline (\\n)',desc:'Ends every message with a line break. Most MakeCode UART programs wait for it.',checked:f.tx.newline,onChange:v=>set('tx','newline',v)}),
    h('div',{className:'grid grid-cols-2 gap-4'},fld('tx','delim','Command delimiter','Placed after the command, before the newline'),fld('tx','delay','Transmission delay (ms)','Pause between packets',NI)),
    h(Toggle,{label:'Command logging',desc:'Show sent commands in Live activity. Slider values are never logged; micro replies always are.',checked:f.tx.log,onChange:v=>set('tx','log',v)}),
    h('p',{className:'mb-2 mt-2 text-xs font-medium text-slate-300'},'Bluetooth UART write mode'),
    h(Seg,{label:'Write mode',value:f.tx.mode,onChange:v=>set('tx','mode',v),options:[['auto','Auto'],['withResponse','With response'],['withoutResponse','No response']]}),
    h('div',{className:'mt-4'},fld('tx','chunk','Bytes per packet','Longer messages are split. 20 suits every micro:bit',NI)))),
  h(LivePreview,{f,E,warnings,dirty}),
  h(Boundary,null,h(CommandTester,{dirtyTx})),
  h('div',{className:'actionbar glass flex flex-wrap items-center justify-between gap-3 p-3'},
   h('p',{'aria-live':'polite',className:'flex items-center gap-2 px-1 text-sm '+(nErr?'text-rose-300':dirty?'text-amber-300':'text-emerald-300')},h(Icon,{n:nErr?'warn':dirty?'info':'check',s:16}),nErr?'Fix '+nErr+(nErr>1?' fields':' field')+' to save':dirty?'Unsaved changes':msg||'All changes saved'),
   h('div',{className:'flex gap-2'},
    h('button',{className:'btn '+(arm?'btn-d':'btn-g'),onClick:doReset},h(Icon,{n:'rot',s:16}),arm?'Confirm reset':'Reset to Default'),
    h('button',{className:'btn btn-p',disabled:!dirty||!!nErr,onClick:doSave},h(Icon,{n:'save',s:16}),'Save Changes'))));
}
